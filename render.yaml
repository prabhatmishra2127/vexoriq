services:
  - type: web
    name: trixoiq
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: APP_NAME
        value: Trixoiq
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: cookie
